<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traducteur de glossaire NkapLingua</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17332c;
      background: #f3f6f2;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto;
    }

    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { line-height: 1.5; }

    .panel {
      padding: 20px;
      border: 1px solid #d5e0d8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 24px #17332c0d;
    }

    label { display: block; font-weight: 650; }

    input, textarea, button { font: inherit; }

    input[type="text"], input[type="search"], textarea {
      width: 100%;
      margin-top: 8px;
      padding: 11px 12px;
      border: 1px solid #b9c9bf;
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }

    input:focus, textarea:focus, button:focus-visible {
      outline: 3px solid #79b89a;
      outline-offset: 2px;
    }

    .language { margin: 20px 0; }

    .catalog {
      max-height: 390px;
      overflow: auto;
      margin-top: 12px;
      border: 1px solid #d5e0d8;
      border-radius: 9px;
    }

    .word {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 16px;
      width: 100%;
      padding: 12px;
      border: 0;
      border-bottom: 1px solid #e8eee9;
      background: #fff;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .word:last-child { border-bottom: 0; }
    .word:hover { background: #f5faf6; }
    .word[aria-current="true"] { background: #e8f4ec; }
    .word-label { font-weight: 650; }
    .word-id { grid-column: 1; color: #60766a; font-size: .82rem; }
    .word-state { grid-column: 2; grid-row: 1 / span 2; align-self: center; color: #60766a; font-size: .82rem; }

    .translation { margin-top: 20px; }
    textarea { min-height: 88px; resize: vertical; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    #progress, #message { color: #60766a; font-size: .92rem; }

    button.download {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      background: #176844;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.download:disabled { background: #9aa9a0; cursor: not-allowed; }

    .error { color: #9b3024; }

    @media (max-width: 560px) {
      main { width: min(100% - 20px, 920px); margin: 18px auto; }
      .panel { padding: 14px; }
      .footer { align-items: stretch; flex-direction: column; }
      button.download { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Traducteur de glossaire</h1>
    <p>Choisissez un mot ou une expression, saisissez sa traduction, puis téléchargez le fichier JSON.</p>

    <section class="panel" aria-label="Éditeur de glossaire">
      <label class="language" for="language">
        Langue à créer
        <input id="language" type="text" autocomplete="off" placeholder="Ex. Ewondo" required>
      </label>

      <label for="search">Mots du glossaire (français)</label>
      <input id="search" type="search" placeholder="Filtrer les mots…">
      <div id="catalog" class="catalog" role="listbox" aria-label="Mots du glossaire"></div>

      <div class="translation">
        <label id="selected-label" for="translation">Sélectionnez un mot dans la liste</label>
        <textarea id="translation" placeholder="Entrez la traduction…" disabled></textarea>
      </div>

      <div class="footer">
        <span>
          <span id="progress">Chargement du glossaire…</span>
          <span id="message" role="status"></span>
        </span>
        <button id="download" class="download" type="button" disabled>Télécharger le glossaire</button>
      </div>
    </section>
  </main>

      return concepts.filter((concept) =>
        `${concept.id} ${conceptLabel(concept)} ${(concept.fr || []).join(" ")}`
          .toLocaleLowerCase("fr")
          .includes(query)
      );
    }

    function renderCatalog() {
      catalogElement.replaceChildren();
      for (const concept of matchingConcepts()) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "word";
        button.setAttribute("role", "option");
        button.setAttribute("aria-current", String(concept.id === selectedId));

        const label = document.createElement("span");
        label.className = "word-label";
        label.textContent = `${concept.icon ? `${concept.icon} ` : ""}${conceptLabel(concept)}`;

        const id = document.createElement("span");
        id.className = "word-id";
        id.textContent = concept.id;

        const state = document.createElement("span");
        state.className = "word-state";
        state.textContent = translations.has(concept.id) ? "Traduit" : "À traduire";

        button.append(label, id, state);
        button.addEventListener("click", () => selectConcept(concept));
        catalogElement.append(button);
      }

      if (!catalogElement.childElementCount) {
        const empty = document.createElement("p");
        empty.textContent = "Aucun mot ne correspond à cette recherche.";
        catalogElement.append(empty);
      }
    }

    function updateProgress() {
      const count = translations.size;
      progressElement.textContent = `${count} traduction${count === 1 ? "" : "s"} saisie${count === 1 ? "" : "s"} sur ${concepts.length}`;
      downloadButton.disabled = !languageInput.value.trim() || count === 0;
    }

    function selectConcept(concept) {
      if (selectedId) {
        const value = translationInput.value.trim();
        if (value) translations.set(selectedId, value);
        else translations.delete(selectedId);
      }

      selectedId = concept.id;
      selectedLabel.textContent = `${conceptLabel(concept)} — ${concept.id}`;
      translationInput.disabled = false;
      translationInput.value = translations.get(selectedId) || "";
      messageElement.textContent = "";
      renderCatalog();
      updateProgress();
      translationInput.focus();
    }

    translationInput.addEventListener("input", () => {
      const value = translationInput.value.trim();
      if (value) translations.set(selectedId, value);
      else translations.delete(selectedId);
      renderCatalog();
      updateProgress();
    });

    languageInput.addEventListener("input", updateProgress);
    searchInput.addEventListener("input", renderCatalog);

    function languageCode(name) {
      return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    downloadButton.addEventListener("click", () => {
      if (selectedId) {
        const value = translationInput.value.trim();
        if (value) translations.set(selectedId, value);
        else translations.delete(selectedId);
      }

      const name = languageInput.value.trim();
      const code = languageCode(name);
      if (!name || !code || !translations.size) {
        messageElement.textContent = "Indiquez la langue et au moins une traduction.";
        return;
      }

      const entries = Object.fromEntries(
        [...translations].map(([id, text]) => [id, { t: text, s: "propose" }])
      );
      const glossary = {
        code,
        name,
        native: name,
        flag: "",
        region: "",
        tts: "fr-FR",
        status_note: "Traductions à relire et valider par des locuteurs natifs.",
        default_status: "propose",
        sources: [],
        entries
      };

      const blob = new Blob([`${JSON.stringify(glossary, null, 2)}\n`], {
        type: "application/json;charset=utf-8"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `glossaire_${code}.json`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      messageElement.textContent = `Fichier téléchargé : glossaire_${code}.json`;
    });

    progressElement.textContent = `${concepts.length} mots et expressions chargés`;
    renderCatalog();
    updateProgress();
  </script>
</body>
</html>
